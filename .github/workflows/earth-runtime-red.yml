name: Earth Runtime RED

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/earth-runtime-red.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run Earth runtime contract
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            tests/earth_sun_orbit_contract.cpp -o /tmp/earth-runtime-contract
          /tmp/earth-runtime-contract
