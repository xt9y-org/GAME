name: Apply Earth Quality Fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-earth-quality-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Replace Earth texture and patch demo
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://svs.gsfc.nasa.gov/vis/a000000/a003600/a003615/flat_earth_Largest_still.0330.jpg' \
            -o Assets/Textures/earth_diffuse.jpg
          python3 - <<'PY'
          from pathlib import Path

          image = Path('Assets/Textures/earth_diffuse.jpg').read_bytes()
          if len(image) < 5_000_000 or image[:2] != b'\xff\xd8' or image[-2:] != b'\xff\xd9':
              raise SystemExit('unexpected Earth texture payload')

          Path('Assets/Textures/earth_diffuse.SOURCE').write_text('''NASA/Goddard Space Flight Center Scientific Visualization Studio\nEquirectangular Projected Earth for LARGEST\n8192x4096 JPEG with global cloud cover\nBlue Marble Next Generation data courtesy of Reto Stockli (NASA/GSFC) and NASA Earth Observatory.\nSource: https://svs.gsfc.nasa.gov/3615\nFile: https://svs.gsfc.nasa.gov/vis/a000000/a003600/a003615/flat_earth_Largest_still.0330.jpg\n''')

          p = Path('Examples/earth.cpp')
          s = p.read_text()

          def replace_once(old, new):
              global s
              if old not in s:
                  raise SystemExit(f'earth.cpp pattern not found: {old[:120]!r}')
              s = s.replace(old, new, 1)

          replace_once(
              '        renderer_->init();\n',
              '''        renderer_->init();\n\n        Renderer::PathTracerSettings& settings = renderer_->settings();\n        settings.resolution_divisor = 2;\n        settings.samples_per_frame = 2;\n        settings.max_bounces = 1;\n        settings.exposure = 1.05f;\n''')
          replace_once(
              '        e->world_->add<Camera::CameraComponent>(e->camera_, Camera::CameraComponent{\n            60.0f, 0.1f, true\n        });',
              '        e->world_->add<Camera::CameraComponent>(e->camera_, Camera::CameraComponent{\n            45.0f, 0.1f, true\n        });')
          replace_once(
              '.z = _center_z + std::max(_globe_radius * 3.0f, 1.0f),',
              '.z = _center_z + std::max(_globe_radius * 2.65f, 1.0f),')
          replace_once(
              '''        const float _sun_orbit_radius = std::max(_globe_radius * 3.0f, 1.0f);\n        const float _sun_vertical_offset = _globe_radius * 0.35f;\n        constexpr float _sun_orbit_seconds = 25.0f;\n        constexpr float _two_pi = 6.28318530717958647692f;\n        float _sun_angle = 0.0f;''',
              '''        const float _sun_orbit_radius = std::max(_globe_radius * 3.0f, 1.0f);\n        const float _sun_vertical_offset = _globe_radius * 1.15f;''')
          replace_once(
              '''            .position = {\n                .x = _center_x + _sun_orbit_radius,\n                .y = _center_y + _sun_vertical_offset,\n                .z = _center_z,\n            },''',
              '''            .position = {\n                .x = _center_x + _sun_orbit_radius * 0.72f,\n                .y = _center_y + _sun_vertical_offset,\n                .z = _center_z + _sun_orbit_radius * 0.68f,\n            },''')
          replace_once(
              '.intensity = _sun_orbit_radius * _sun_orbit_radius * 4.0f,',
              '.intensity = _sun_orbit_radius * _sun_orbit_radius * 1.8f,')
          replace_once(
              '''            _sun_angle = std::fmod(\n                _sun_angle + frame_delta * (_two_pi / _sun_orbit_seconds),\n                _two_pi\n            );\n\n            if (Renderer::Transform *sun = e->world_->get<Renderer::Transform>(_light))\n            {\n                sun->position.x = _center_x + std::cos(_sun_angle) * _sun_orbit_radius;\n                sun->position.y = _center_y + _sun_vertical_offset;\n                sun->position.z = _center_z + std::sin(_sun_angle) * _sun_orbit_radius;\n                e->world_->markChanged();\n            }\n\n''',
              '')

          p.write_text(s)
          PY
      - name: Commit Earth quality fix
        run: |
          git config user.name xt9y
          git config user.email felix@xt9y.de
          git add Assets/Textures/earth_diffuse.jpg \
                  Assets/Textures/earth_diffuse.SOURCE \
                  Examples/earth.cpp
          git commit -m 'earth: improve texture quality and freeze sun'
          git push origin HEAD:main
