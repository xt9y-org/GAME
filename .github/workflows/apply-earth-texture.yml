name: Apply Earth Texture

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-earth-texture.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add Blue Marble diffuse map
        run: |
          set -euo pipefail
          mkdir -p Assets/Textures
          curl -fL --retry 3 \
            'https://upload.wikimedia.org/wikipedia/commons/c/cd/Land_ocean_ice_2048.jpg' \
            -o Assets/Textures/earth_diffuse.jpg
          python3 - <<'PY'
          from pathlib import Path
          data = Path('Assets/Textures/earth_diffuse.jpg').read_bytes()
          if len(data) < 200000 or data[:2] != b'\xff\xd8' or data[-2:] != b'\xff\xd9':
              raise SystemExit('downloaded Earth texture is not the expected JPEG')
          PY
          cat > Assets/Textures/earth_diffuse.SOURCE <<'EOF'
          NASA Blue Marble: Land Surface, Ocean Color and Sea Ice
          2048x1024 equirectangular JPEG
          NASA Goddard Space Flight Center; image by Reto Stoeckli, enhancements by Robert Simmon.
          Source record: https://visibleearth.nasa.gov/view.php?id=57730
          Mirrored file used for reproducible checkout: https://commons.wikimedia.org/wiki/File:Land_ocean_ice_2048.jpg
          Commons distribution license: CC BY-SA 3.0 / GFDL as documented on the file page.
          EOF
      - name: Commit asset
        run: |
          git config user.name xt9y
          git config user.email felix@xt9y.de
          git add Assets/Textures/earth_diffuse.jpg Assets/Textures/earth_diffuse.SOURCE
          git commit -m 'assets: add Earth Blue Marble diffuse map'
          git push origin HEAD:main
