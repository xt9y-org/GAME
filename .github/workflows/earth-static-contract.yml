name: Earth Static Contract

on:
  push:
    branches: [main]
    paths:
      - 'Examples/earth.cpp'
      - 'tests/earth_sun_orbit_contract.cpp'
      - '.github/workflows/earth-static-contract.yml'
  pull_request:
    paths:
      - 'Examples/earth.cpp'
      - 'tests/earth_sun_orbit_contract.cpp'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run contract
        run: |
          c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            tests/earth_sun_orbit_contract.cpp \
            -o /tmp/earth-static-contract
          /tmp/earth-static-contract
